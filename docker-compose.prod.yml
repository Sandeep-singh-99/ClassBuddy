services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: classbuddy_server_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    env_file:
      - ./server/.env
    environment:
      - PYTHONUNBUFFERED=1
      - WORKERS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        - VITE_OAUTH_CLIENT_ID=${VITE_OAUTH_CLIENT_ID:-classbuddy-web}
        - VITE_OAUTH_REDIRECT_URI=${VITE_OAUTH_REDIRECT_URI:-http://localhost/oauth/callback}
    container_name: classbuddy_client_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
