name: Backend CI/CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -f server/Dockerfile \
            -t sand07/classbuddy-backend:${{ github.sha }} \
            -t sand07/classbuddy-backend:latest \
            server

      - name: Push Docker image
        run: |
          docker push sand07/classbuddy-backend:${{ github.sha }}
          docker push sand07/classbuddy-backend:latest

      - name: Deploy Backend to Render
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"